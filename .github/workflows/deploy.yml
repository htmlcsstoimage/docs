name: Build and preview docs

on:
  push:
    branches: [docs-new, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DOCS_ORIGIN: https://docs-new-docs.mike.workers.dev
          DOCS_BRANCH: ${{ github.head_ref || github.ref_name }}
      - run: npm run check:migration

  preview:
    needs: check
    if: github.ref == 'refs/heads/docs-new' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: docs-preview
      url: https://docs-new-docs.mike.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build with signed HCTI Open Graph URLs
        run: npm run build
        env:
          DOCS_ORIGIN: https://docs-new-docs.mike.workers.dev
          DOCS_BRANCH: docs-new
          REQUIRE_OG_SIGNING: 'true'
          HCTI_API_ID: ${{ secrets.V2_HCTI_API_ID }}
          HCTI_API_KEY: ${{ secrets.V2_HCTI_API_KEY }}
      - run: npm run check:migration
      - name: Upload preview version (does not deploy to production)
        run: npx wrangler versions upload --preview-alias docs-new
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Verify preview routes and headers
        run: node scripts/check-preview.mjs https://docs-new-docs.mike.workers.dev

  # No production promotion during the migration. main's existing Jekyll
  # workflow stays in effect until this branch is merged. Add the production
  # deployment step only as part of the approved cutover.
