name: Build and deploy docs

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Empty uses the production context endpoint; configure overrides in Actions variables.
  POSTHOG_CTX_URL: ${{ vars.POSTHOG_CTX_URL }}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          DOCS_ORIGIN: https://docs.htmlcsstoimage.com
          DOCS_BRANCH: main
      - run: npm run check

  preview:
    needs: check
    # Retained for future use; change this condition to re-enable preview uploads.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment:
      name: docs-preview
      url: https://docs-new-docs.mike.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build with signed HCTI Open Graph URLs
        run: npm run build
        env:
          DOCS_ORIGIN: https://docs-new-docs.mike.workers.dev
          DOCS_BRANCH: docs-new
          REQUIRE_OG_SIGNING: 'true'
          HCTI_API_ID: ${{ secrets.V2_HCTI_API_ID }}
          HCTI_API_KEY: ${{ secrets.V2_HCTI_API_KEY }}
      - run: npm run check
      - name: Upload preview version (does not deploy to production)
        run: npx wrangler versions upload --preview-alias docs-new
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Verify preview routes and headers
        run: node scripts/check-preview.mjs https://docs-new-docs.mike.workers.dev

  production:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: docs-production
      url: https://docs.htmlcsstoimage.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build production docs with signed HCTI Open Graph URLs
        run: npm run build
        env:
          DOCS_ORIGIN: https://docs.htmlcsstoimage.com
          DOCS_ENV: production
          DOCS_BRANCH: main
          REQUIRE_OG_SIGNING: 'true'
          HCTI_API_ID: ${{ secrets.V2_HCTI_API_ID }}
          HCTI_API_KEY: ${{ secrets.V2_HCTI_API_KEY }}
      - run: npm run check
      - name: Verify production metadata and sitemap
        run: node scripts/check-production.mjs
      - name: Deploy production Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
